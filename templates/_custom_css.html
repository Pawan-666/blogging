<style>

  /* Standard light mode colors */
  body {
    --primary-color: #376dd9;
    --primary-pale-color: #698bcf1c;
    --inline-code-color: #444444;
    --text-color: #444;
    --text-pale-color: #545967;
    --bg-color: #fff; 
    --highlight-mark-color: #5f75b045;
  
    --callout-note-color: #3e70d6;
    --callout-important-color: #7a46cd;
    --callout-warning-color: #d3822b;
    --callout-alert-color: #d43f3f;
    --callout-question-color: #3089b5;
    --callout-tip-color: #35a06b;
  }

  /* Standard dark mode colors */
  body.dark {
    --primary-color: #689afd;
    --primary-pale-color: #93acdd1c;
    --inline-code-color: #d2d2d2;
    --text-color: #ddd;
    --text-pale-color: #a0a0a0;
    --bg-color: #202124;
    --highlight-mark-color: #5f75b045;

    --callout-note-color: #698bcf;
    --callout-important-color: #9374c5;
    --callout-warning-color: #c99054;
    --callout-alert-color: #d35757;
    --callout-question-color: #5091b2;
    --callout-tip-color: #3ea06f;
  }

  /* Terminal styling for homepage - green theme (light mode) */
  body.homepage {
    /* Darker green colors for light mode readability */
    --primary-color: #2d7d2d;           /* Forest green - readable on white */
    --primary-pale-color: #2d7d2d20;   /* Pale forest green */
    --inline-code-color: #1a5c1a;      /* Dark forest green */
    
    /* Terminal-style accent colors in darker green for light mode */
    --terminal-cyan: #2d7d2d;
    --terminal-yellow: #2d7d2d;
    --terminal-red: #2d7d2d;
    --terminal-blue: #2d7d2d;
    --terminal-purple: #2d7d2d;
  }

  body.homepage.dark {
    /* Enhanced green theme for dark mode */
    --primary-color: #39ff14;           /* Neon green */
    --primary-pale-color: #39ff1420;   /* Pale neon green */
    --inline-code-color: #7cfc00;      /* Bright lime green */
    
    /* Terminal accent colors for dark mode */
    --terminal-cyan: #39ff14;
    --terminal-yellow: #39ff14;
    --terminal-red: #39ff14;
    --terminal-blue: #39ff14;
    --terminal-purple: #39ff14;
    
    /* Enhanced visual effects */
    --glow-color: #39ff14;
    --glow-shadow: 0 0 20px #39ff14, 0 0 40px #39ff1440, 0 0 60px #39ff1420;
    --text-glow: 0 0 10px #39ff14, 0 0 20px #39ff1460, 0 0 30px #39ff1430;
  }

  /* Standard typography */
  body {
    --main-font: "IBMPlexSans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    --code-font: "IBMPlexMono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    --homepage-max-width: 750px;
    --main-max-width: 750px;
    --avatar-size: 175px;
    --paragraph-font-size: 16px;
    --paragraph-line-height: 1.5em;
    --aside-font-size: 16px;
    --img-border-radius: 4px;
    --inline-code-border-radius: 2px;
  }

  /* Terminal typography - ONLY for homepage */
  body.homepage {
    --main-font: "IBMPlexMono", "Fira Code", "Source Code Pro", "Consolas", "Monaco", "Courier New", monospace;
    --paragraph-line-height: 1.4em;
    --img-border-radius: 2px;
    
    font-family: var(--main-font);
    background: var(--bg-color);
    color: var(--text-color);
  }

  /* ========== LAST.FM MUSIC WIDGET ========== */

  /* Album art */
  .album-art {
    width: 70px !important;
    height: 70px !important;
    min-width: 70px;
    max-width: 70px;
    min-height: 70px;
    max-height: 70px;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border: 2px solid var(--primary-color);
    border-radius: 0 !important;
    display: none;
    transition: all 0.3s ease;
    flex-shrink: 0;
  }

  .album-art:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px var(--primary-pale-color);
  }

  body.dark .album-art {
    box-shadow: 0 0 10px var(--primary-pale-color);
  }

  /* Music container */
  .music-container {
    display: flex;
    gap: 1em;
    align-items: center;
  }

  .music-info {
    flex: 1;
  }

  .music-output {
    margin-bottom: 1em;
    font-size: 0.9em;
    line-height: 1.6;
  }

  .music-output .info-label {
    color: var(--text-pale-color);
    font-weight: 500;
    opacity: 0.8;
  }

  .music-output .info-sep {
    color: var(--text-pale-color);
    opacity: 0.5;
  }

  .music-output .info-value {
    color: var(--primary-color);
    font-weight: bold;
  }

  /* Now playing link */
  #now-playing-track a {
    color: var(--primary-color);
    text-decoration: none;
  }

  #now-playing-track a:hover {
    text-decoration: underline;
  }

  body.dark #now-playing-track a {
    text-shadow: 0 0 8px var(--primary-color);
  }

  /* ========== INLINE SOCIAL LINKS ========== */

  .social-icons-inline {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    padding: 8px 0;
  }

  .social-icons-inline a {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-color);
    text-decoration: none;
    transition: all 0.25s ease;
    font-size: 0.9em;
  }

  .social-icons-inline a:hover {
    color: var(--primary-color);
  }

  body.dark .social-icons-inline a:hover {
    text-shadow: 0 0 8px var(--primary-color);
  }

  .social-icons-inline a svg {
    width: 16px;
    height: 16px;
  }

  .social-icons-inline .link-name {
    color: var(--primary-color);
  }

  /* Simplified prompt */
  .prompt {
    color: var(--primary-color);
    font-weight: bold;
    margin-right: 8px;
  }

  body.dark .prompt {
    text-shadow: 0 0 6px var(--primary-color);
  }

  /* Terminal animation - hide elements initially */
  .terminal-content .terminal-line,
  .terminal-content .output {
    opacity: 0;
    animation: fadeIn 0.2s ease forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* Animation delays - prompt then output sequence */
  .anim-delay-1 { animation-delay: 0.2s !important; }   /* whoami prompt */
  .anim-delay-2 { animation-delay: 1.0s !important; }   /* whoami output */
  .anim-delay-3 { animation-delay: 1.8s !important; }   /* music prompt */
  .anim-delay-4 { animation-delay: 2.6s !important; }   /* music output */
  .anim-delay-5 { animation-delay: 3.2s !important; }   /* links prompt */
  .anim-delay-6 { animation-delay: 4.0s !important; }   /* links output */
  .anim-delay-7 { animation-delay: 4.6s !important; }   /* final cursor */

</style>
